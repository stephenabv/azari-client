name: Build, Test Connection and Deploy to VM

on:
  push:
    branches:
      - dev

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate secrets
        run: |
          test -n "${{ secrets.VM_HOST }}" || (echo "VM_HOST is missing" && exit 1)
          test -n "${{ secrets.VM_USER }}" || (echo "VM_USER is missing" && exit 1)
          test -n "${{ secrets.VM_SSH_PRIVATE_KEY }}" || (echo "VM_SSH_PRIVATE_KEY is missing" && exit 1)

      - name: Set VITE_ADMIN_ROUTE env
        id: set-admin-route
        run: |
          # Generate a secure random slug if not provided by secret
          if [ -z "${{ secrets.VITE_ADMIN_ROUTE }}" ]; then
            export VITE_ADMIN_ROUTE="ops-console-$(openssl rand -hex 8)"
          else
            export VITE_ADMIN_ROUTE="${{ secrets.VITE_ADMIN_ROUTE }}"
          fi
          echo "VITE_ADMIN_ROUTE=$VITE_ADMIN_ROUTE" >> $GITHUB_ENV
          echo "Admin route set to: $VITE_ADMIN_ROUTE"

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_ADMIN_ROUTE: ${{ env.VITE_ADMIN_ROUTE }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VM_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Populate known_hosts; for higher assurance store the verified host
          # fingerprint as VM_HOST_KEY secret and use that instead.
          ssh-keyscan -p ${{ secrets.VM_PORT || '22' }} ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa \
            -p ${{ secrets.VM_PORT || '22' }} \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "echo 'SSH Connection Successful'"

      - name: Deploy build artifacts
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.VM_PORT || '22' }}" \
            build/ \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/azari/build/

          scp -i ~/.ssh/id_rsa -P ${{ secrets.VM_PORT || '22' }} \
            ecosystem.config.cjs \
            package.json \
            package-lock.json \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/azari/

      - name: Install runtime dependencies on VM
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.VM_PORT || '22' }} \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "cd /var/www/azari && npm ci --omit=dev"

      - name: Deploy nginx config
        run: |
          scp -i ~/.ssh/id_rsa -P ${{ secrets.VM_PORT || '22' }} \
            nginx.conf \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/azari-nginx.conf

          ssh -i ~/.ssh/id_rsa -p ${{ secrets.VM_PORT || '22' }} \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo nginx -t -c /tmp/azari-nginx.conf && \
             sudo cp /tmp/azari-nginx.conf /etc/nginx/sites-available/azari && \
             sudo nginx -s reload"

      - name: Restart SSR server
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.VM_PORT || '22' }} \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "cd /var/www/azari && \
             pm2 reload ecosystem.config.cjs --update-env 2>/dev/null || \
             (pm2 start ecosystem.config.cjs && pm2 save)"
