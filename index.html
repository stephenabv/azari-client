<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Default robots: noindex for the raw SPA shell.
    Public pages override this to "index,follow" via react-helmet-async (and the
    override is baked into their prerendered HTML by the SSG build).
    The admin route never sets a SeoHead, so it permanently keeps noindex,nofollow.
  -->
  <meta name="robots" content="noindex,nofollow" />

  <title>Azari Solar | Clean & Renewable Energy Solutions</title>
  <meta name="description"
    content="Azari Solar provides reliable and sustainable solar energy solutions for homes and businesses. Save on energy costs and switch to clean power today." />
  <meta name="keywords"
    content="solar energy, solar panels, renewable energy, solar installation, clean energy, Azari Solar" />
  <meta name="author" content="Azari Solar" />

  <meta property="og:title" content="Azari Solar | Clean & Renewable Energy Solutions" />
  <meta property="og:description"
    content="Switch to solar with Azari Solar. Affordable, reliable, and sustainable energy solutions for your home or business." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://azari.solar" />
  <meta property="og:image" content="https://azari.solar/preview.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Azari Solar | Clean & Renewable Energy Solutions" />
  <meta name="twitter:description"
    content="Power your future with solar energy. Discover Azari Solar solutions today." />
  <meta name="twitter:image" content="https://azari.solar/preview.jpg" />

  <!-- Theme Color (mobile browsers) -->
  <meta name="theme-color" content="#0f172a" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
