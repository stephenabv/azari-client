server {
    listen 80;
    listen [::]:80;
    server_name azari.solar www.azari.solar;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name azari.solar www.azari.solar;

    ssl_certificate     /etc/letsencrypt/live/azari.solar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azari.solar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/azari/build/client;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Canonical: strip www
    if ($host = www.azari.solar) {
        return 301 https://azari.solar$request_uri;
    }

    # Static assets with long cache (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public files (favicon, manifest, robots.txt from /public)
    location ~ ^/(favicon|apple-touch-icon|android-chrome|site\.webmanifest|preview\.jpg) {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Backend API — proxy to azari-service
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else — SSR server
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
