server {
    server_tokens off;
    server_name azari.solar www.azari.solar;

    root /var/www/azari/build/client;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Client connection timeouts
    client_body_timeout   15s;
    client_header_timeout 15s;
    keepalive_timeout     65s;
    send_timeout          15s;

    # Security response headers — applied to all responses from this server.
    # Express/Helmet also sets these for /api/* responses; having them here
    # ensures they cover the SSR server and static assets too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "SAMEORIGIN"                                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;
    add_header Cross-Origin-Opener-Policy "same-origin"                                  always;

    # Canonical: strip www
    if ($host = www.azari.solar) {
        return 301 https://azari.solar$request_uri;
    }

    # Hashed static assets — immutable, 1 year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public files (favicon, manifest, etc.)
    location ~ ^/(favicon|apple-touch-icon|android-chrome|site\.webmanifest) {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # OG image — infrequently updated, long cache
    location = /preview.jpg {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts — immutable, 1 year
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Well-known root text files — served directly, short cache
    location ~ ^/(robots\.txt|llms\.txt)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Static data files (e.g. countries-50m.json for client-side map)
    location /data/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Public logo images — not fingerprinted, moderate cache (30 days)
    # Covers any logo.png / logo2.png placed in public/logos/ and any
    # old-CSS browser cache still referencing /logos/ before the LESS fix
    # re-routes these through Vite's hashed /assets/ pipeline.
    location /logos/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Public images — not fingerprinted, moderate cache (30 days)
    # Covers /images/performance-bg.jpg and similar assets served from public/.
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Backend API — proxy to azari-service
    location ^~ /api/ {
        client_max_body_size 12M;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Prevent proxy/CDN caches from storing sensitive API responses
        add_header Cache-Control "no-store, no-cache" always;
        add_header X-Robots-Tag  "noindex, nofollow"  always;

        # To enable proxySecretGuard on the backend, uncomment and set the
        # value to match INTERNAL_PROXY_SECRET in the backend .env:
        # proxy_set_header X-Internal-Proxy-Secret "your-secret-here";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Everything else — SSR server on port 3000
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/ssl/azari/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/ssl/azari/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # Go straight to the canonical apex host. Redirecting to https://www first
    # and letting the TLS server block strip the www cost a second hop on every
    # http://www request.
    if ($host = www.azari.solar) {
        return 301 https://azari.solar$request_uri;
    }

    if ($host = azari.solar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name azari.solar www.azari.solar;
    return 404; # managed by Certbot
}
