# One URL per page: the slash-free form. Any path ending in "/" (except the
# root and /api/) maps to the same path without it, keeping the query string;
# the server block below 301s to that. It reads the raw $request_uri rather
# than the decoded $uri, so an encoded CR/LF can never reach the Location
# header, and the redirect always names the host, so a path such as
# "//evil.com/" cannot become an off-site redirect. This file is included in
# nginx's http context, where map is allowed.
map $request_uri $azari_slashless_uri {
    "~^/api/"                                     "";
    "~^(?<azari_path>/[^?]*[^/?])/+(?<azari_query>\?.*)?$"   "$azari_path$azari_query";
    default                                       "";
}

# Cache-Control for files nginx serves from disk, chosen by path and set once
# at server level (see the add_header below). Doing it here instead of with
# add_header inside each location keeps the server-level security headers on
# these responses: nginx drops inherited add_header directives in any location
# that defines its own. An empty value adds no header, so responses from the
# SSR server and the API keep the Cache-Control they set themselves.
# After try_files, $uri is the file actually served, so a prerendered page
# matches the .html rule.
map $uri $azari_cache_control {
    "~^/api/"                                                     "";
    "~^/(assets|fonts)/"                                          "public, max-age=31536000, immutable";
    "/preview.jpg"                                                "public, max-age=31536000, immutable";
    "~\.html$"                                                   "public, max-age=0, must-revalidate";
    "~^/(favicon|apple-touch-icon|android-chrome|site\.webmanifest)" "public, max-age=604800";
    "~^/(robots\.txt|llms\.txt)$"                               "public, max-age=86400";
    "~^/(data|logos|images)/"                                     "public, max-age=2592000";
    default                                                       "";
}

# Fonts may be requested cross-origin (crossorigin preloads, CDN in front).
map $uri $azari_font_cors {
    "~^/fonts/"   "*";
    default       "";
}

server {
    server_tokens off;
    server_name azari.solar www.azari.solar;

    root /var/www/azari/build/client;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Brotli, when the server has the module. The deploy installs
    # nginx/azari-brotli.conf as /etc/nginx/snippets/azari-brotli.conf only if
    # `nginx -t` accepts it; otherwise the glob matches nothing and gzip alone
    # is used.
    include /etc/nginx/snippets/azari-brotli*.conf;

    # Client connection timeouts
    client_body_timeout   15s;
    client_header_timeout 15s;
    keepalive_timeout     65s;
    send_timeout          15s;

    # Security response headers — applied to all responses from this server.
    # Express/Helmet also sets these for /api/* responses; having them here
    # ensures they cover the SSR server and static assets too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "SAMEORIGIN"                                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"      always;
    add_header Cross-Origin-Opener-Policy "same-origin"                                  always;

    # Caching and font CORS for static files (see the maps at the top).
    add_header Cache-Control                $azari_cache_control;
    add_header Access-Control-Allow-Origin  $azari_font_cors;

    # Canonical: strip www
    if ($host = www.azari.solar) {
        return 301 https://azari.solar$request_uri;
    }

    # Canonical: no trailing slash (see the map at the top of this file)
    if ($azari_slashless_uri) {
        return 301 https://azari.solar$azari_slashless_uri;
    }

    # Hashed static assets — immutable, 1 year (Cache-Control from the map)
    location /assets/ {
        try_files $uri =404;
    }

    # Public files (favicon, manifest, etc.)
    location ~ ^/(favicon|apple-touch-icon|android-chrome|site\.webmanifest) {
        try_files $uri =404;
    }

    # OG image — infrequently updated, long cache
    location = /preview.jpg {
        try_files $uri =404;
    }

    # Self-hosted fonts — immutable, 1 year
    location /fonts/ {
        try_files $uri =404;
    }

    # Well-known root text files — served directly, short cache
    location ~ ^/(robots\.txt|llms\.txt)$ {
        try_files $uri =404;
    }

    # Static data files (e.g. countries-50m.json for client-side map)
    location /data/ {
        try_files $uri =404;
    }

    # Public logo images — not fingerprinted, moderate cache (30 days)
    # Covers any logo.png / logo2.png placed in public/logos/ and any
    # old-CSS browser cache still referencing /logos/ before the LESS fix
    # re-routes these through Vite's hashed /assets/ pipeline.
    location /logos/ {
        try_files $uri =404;
    }

    # Public images — not fingerprinted, moderate cache (30 days)
    # Covers any images placed under public/images/.
    location /images/ {
        try_files $uri =404;
    }

    # Images stored in the database, served by azari-service as files. Each URL
    # names one upload (the version is in the path), so the backend sends a
    # one-year immutable Cache-Control and nginx must not override it with the
    # no-store applied to the rest of /api/. Like /api/, security headers come
    # from Helmet in the backend (defining add_header here stops nginx from
    # adding the server-level copies a second time).
    location ^~ /api/media/ {
        add_header X-Robots-Tag "noindex" always;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Backend API — proxy to azari-service
    location ^~ /api/ {
        client_max_body_size 12M;

        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Prevent proxy/CDN caches from storing sensitive API responses
        add_header Cache-Control "no-store, no-cache" always;
        add_header X-Robots-Tag  "noindex, nofollow"  always;

        # To enable proxySecretGuard on the backend, uncomment and set the
        # value to match INTERNAL_PROXY_SECRET in the backend .env:
        # proxy_set_header X-Internal-Proxy-Secret "your-secret-here";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Everything else. Pages prerendered at build time live at
    # build/client/<path>/index.html and are served straight from disk with a
    # 200. Without this the request reached react-router-serve, whose static
    # handler answers a directory path with a 301 to "<path>/", the opposite of
    # the canonical URL. Every other path goes to the SSR server.
    # Prerendered HTML revalidates on every visit (ETag / Last-Modified, so a
    # repeat visit is a 304); SSR HTML gets its Cache-Control from the app.
    location / {
        try_files $uri/index.html @ssr;
    }

    # SSR server on port 3000
    location @ssr {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # http2: over HTTP/1.1 a browser opens at most six connections to the
    # site, so a page of photos still downloading could hold every one of them
    # and stall the next page's data request behind the images. HTTP/2 carries
    # them all on one connection. `listen ... http2` works on every nginx
    # version (newer ones also accept `http2 on;`); the deploy's `nginx -t`
    # rolls the config back if it is rejected.
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/ssl/azari/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/ssl/azari/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    # Go straight to the canonical apex host. Redirecting to https://www first
    # and letting the TLS server block strip the www cost a second hop on every
    # http://www request.
    if ($host = www.azari.solar) {
        return 301 https://azari.solar$request_uri;
    }

    if ($host = azari.solar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name azari.solar www.azari.solar;
    return 404; # managed by Certbot
}
