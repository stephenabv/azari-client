# Brotli compression for azari.solar. Included by nginx.conf only when the
# server's nginx has ngx_brotli (the deploy checks with `nginx -t`).
# Text responses only; images, video and woff2 are already compressed.
brotli            on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types      text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;
